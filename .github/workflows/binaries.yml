name: Build binary artifacts

on:
  push:
    branches: ['**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.gitattributes'
      - '.cargo/**'
      - 'crates/**'
      - 'scripts/update-binaries.py'
      - '.github/workflows/binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build release and record source/payload hashes
        run: python scripts/update-binaries.py --target ${{ matrix.target }}
      - name: Verify generated download
        run: python scripts/update-binaries.py --check --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: nozhik-${{ matrix.platform }}
          path: binaries/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
