[workspace]
members = ["crates/core", "crates/event_bus", "crates/config", "crates/app", "crates/buffer", "crates/ui", "crates/fs_model", "crates/vcs", "crates/plugin_host", "crates/language_support", "crates/terminal", "crates/remote_ssh"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
nozhik-remote-ssh = { path = "crates/remote_ssh" }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
rand = "0.10"
keyring = { version = "3.6.3", default-features = false }
zeroize = "1.9"
nozhik-terminal = { path = "crates/terminal" }
portable-pty = "0.9"
nix = { version = "0.28", features = ["signal"] }
vt100 = "0.16.2"
parking_lot = "0.12"
nozhik-language-support = { path = "crates/language_support" }
tree-sitter = "0.25"
tree-sitter-php = "0.24.2"
lsp-types = "0.95.1"
nozhik-plugin-host = { path = "crates/plugin_host" }
semver = { version = "1", features = ["serde"] }
nozhik-vcs = { path = "crates/vcs" }
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
nozhik-fs-model = { path = "crates/fs_model" }
notify = "8"
ignore = "0.4.33"
fuzzy-matcher = "0.3"
nozhik-core = { path = "crates/core" }
nozhik-event-bus = { path = "crates/event_bus" }
nozhik-config = { path = "crates/config" }
nozhik-buffer = { path = "crates/buffer" }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
regex-cursor = { version = "0.1.5", features = ["ropey"] }
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
toml = "0.9"
egui = "0.32.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
nozhik-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

